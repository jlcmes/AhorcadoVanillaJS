<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego del Ahorcado Simplificado</title>
  <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
  <div class="contenedor">
    <h1>Juego del Ahorcado</h1>
    <div id="palabraContenedor"></div> <!-- Muestra las letras adivinadas de la palabra -->
    <div id="letrasContenedor"></div>   <!-- Botones de letras para adivinar -->
    <div id="mensaje"></div>            <!-- Mensaje de victoria o derrota -->
    <div id="nerrores"></div>           <!-- Número de errores -->
    <button id="reiniciarBtn" onclick="iniciarJuego()">Reiniciar</button> <!-- Botón para reiniciar el juego -->
  </div>
  <script src="./js/codigo.js"></script>
</body>
</html>
